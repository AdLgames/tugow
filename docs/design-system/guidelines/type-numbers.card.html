<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--tb-background);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-10);align-items:stretch}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--tb-ink-dim);letter-spacing:.04em}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:96px;border:1px solid var(--tb-panel-edge);border-radius:var(--radius-panel);padding:8px}.hex{font-family:var(--font-mono);font-size:11px}</style></head><body>
<div style="display:flex;align-items:center;gap:26px;font-family:var(--font-mono);font-variant-numeric:tabular-nums">
<span style="font-size:34px;font-weight:700;color:var(--tb-locked)">6</span>
<span style="font-size:34px;font-weight:700">3</span>
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px">265 / 385</span><span class="lbl">floor score / threshold</span></div>
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;color:var(--tb-player)">you 1,080</span><span class="lbl">spent box</span></div>
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;color:var(--tb-burned)">scratch</span><span class="lbl">preview of 0</span></div>
</div></body></html>
