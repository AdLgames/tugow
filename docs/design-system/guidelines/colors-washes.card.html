<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--tb-background);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-10);align-items:stretch}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--tb-ink-dim);letter-spacing:.04em}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:96px;border:1px solid var(--tb-panel-edge);border-radius:var(--radius-panel);padding:8px}.hex{font-family:var(--font-mono);font-size:11px}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--tb-player-wash);border-color:#6fae7c"><span class="lbl">--tb-player-wash</span><span class="hex" style="color:#6fae7c">12%</span></div>
<div class="sw" style="background:var(--tb-adversary-wash);border-color:#c8452f"><span class="lbl">--tb-adversary-wash</span><span class="hex" style="color:#c8452f">12%</span></div>
<div class="sw" style="background:var(--tb-locked-wash);border-color:#d9a441"><span class="lbl">--tb-locked-wash</span><span class="hex" style="color:#d9a441">14%</span></div>
<div class="sw" style="background:var(--tb-declared-wash);border-color:#e0703c"><span class="lbl">--tb-declared-wash</span><span class="hex" style="color:#e0703c">14%</span></div>
</div></body></html>
