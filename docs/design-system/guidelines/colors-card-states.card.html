<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--tb-background);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-10);align-items:stretch}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--tb-ink-dim);letter-spacing:.04em}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:96px;border:1px solid var(--tb-panel-edge);border-radius:var(--radius-panel);padding:8px}.hex{font-family:var(--font-mono);font-size:11px}</style></head><body>
<div class="row">
<div class="sw" style="background:#e8dcc0;color:#14121a"><span class="lbl" style="color:#14121a">open</span><span class="hex">#e8dcc0</span></div>
<div class="sw" style="background:#6fae7c;color:#14121a"><span class="lbl" style="color:#14121a">player · you</span><span class="hex">#6fae7c</span></div>
<div class="sw" style="background:#c8452f;color:#14121a"><span class="lbl" style="color:#14121a">adversary · them</span><span class="hex">#c8452f</span></div>
<div class="sw" style="background:#55505e;color:#e8dcc0"><span class="lbl">burned</span><span class="hex">#55505e</span></div>
</div></body></html>
