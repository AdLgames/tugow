<!-- @dsCard group="Card" viewport="700x340" name="Row states & marks" subtitle="open, yours, theirs, burned, scratched — plus claim, scorch, scratch, reclaim" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:14px 16px;background:var(--tb-background)}
.sheet{width:660px;background:linear-gradient(180deg,#e8dcc0,#d8caa9);border-radius:2px;padding:10px 14px;
  box-shadow:0 18px 40px #000a;font-family:var(--font-body);color:#191420}
.r{position:relative;display:grid;grid-template-columns:14px 1fr 96px;gap:8px;align-items:center;height:44px;
  border-bottom:1px solid #19142017;font-size:14px}
.r b{font-family:var(--font-display);font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.r i{font-style:normal;font-size:11px;color:#191420a6}
.r em{font-family:var(--font-mono);font-style:normal;font-size:12px;text-align:right}
.mine em{color:#2f5c39}.theirs em{color:#a12f1e}
.theirs{background:#c8452f14}
.burned{background:repeating-linear-gradient(45deg,#19142014 0 6px,#0000 6px 12px)}
.burned b,.burned i,.burned em{opacity:.42}
.declared{background:#e0703c2b;box-shadow:inset 0 0 0 1px #c8452f66}
.stamp{position:absolute;right:104px;top:4px;width:110px;height:36px;transform:rotate(-7deg);
  border:2px solid #a12f1e;border-radius:3px;color:#a12f1e;font-family:var(--font-display);font-weight:700;
  font-size:12px;letter-spacing:.14em;display:grid;place-items:center;opacity:.82;
  box-shadow:inset 0 0 0 1px #a12f1e59}
.scorch{position:absolute;left:96px;top:2px;width:200px;height:40px;border-radius:50%;
  background:radial-gradient(60% 60% at 50% 50%,#120c08 0 34%,#3a2213 52%,#7a5330a6 70%,#0000 82%);
  box-shadow:0 0 18px #1a0f07}
.exx{position:absolute;left:150px;top:0;width:120px;height:44px}
.exx i{position:absolute;left:0;top:20px;width:120px;height:4px;background:#8e2f22;border-radius:2px}
.exx i:first-child{transform:rotate(14deg)}.exx i:last-child{transform:rotate(-16deg)}
.reclaim{position:absolute;right:104px;top:8px;width:120px;height:28px;
  background:repeating-linear-gradient(92deg,#2f5c3947 0 8px,#0000 8px 14px);border-radius:2px;
  box-shadow:inset 0 0 0 1px #2f5c3959}
.lbl{font-family:var(--font-mono);font-size:10px;color:#55505e;margin:8px 0 4px}
</style></head><body>
<div class="sheet">
  <div class="r"><span></span><span><b>Aces</b> <i>Sum of 1s x 1</i></span><em>scratch</em></div>
  <div class="r declared"><span style="font-family:var(--font-mono);color:#a12f1e">&gt;</span><span><b>Sixes</b> <i>Sum of 6s x 6</i></span><em>108</em></div>
  <div class="r mine"><span></span><span><b>Threes</b> <i>Sum of 3s x 3</i></span><em>you 27</em><div class="reclaim"></div></div>
  <div class="r theirs"><span></span><span><b>Four of a Kind</b> <i>Quad face cubed x 5</i></span><em>them 320</em><div class="stamp">Claimed</div></div>
  <div class="r burned"><span></span><span><b>Large Straight</b> <i>Product of all five</i></span><em>burned 0</em><div class="scorch"></div></div>
  <div class="r mine"><span></span><span><b>Yahtzee</b> <i>Face to the fourth x 2</i></span><em>you 0</em><div class="exx"><i></i><i></i></div></div>
</div>
<div class="lbl">row 700×56 · claim stamp 220×80 · scorch 200×70 · scratch X 200×70 · reclaim flourish 220×80</div>
</body></html>
