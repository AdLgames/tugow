<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--tb-background);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-10);align-items:stretch}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--tb-ink-dim);letter-spacing:.04em}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:96px;border:1px solid var(--tb-panel-edge);border-radius:var(--radius-panel);padding:8px}.hex{font-family:var(--font-mono);font-size:11px}</style></head><body>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:10px"><span class="lbl" style="width:34px">2px</span><span style="height:6px;width:12px;background:var(--tb-ink-dim)"></span></div><div style="display:flex;align-items:center;gap:10px"><span class="lbl" style="width:34px">6px</span><span style="height:6px;width:36px;background:var(--tb-ink-dim)"></span></div><div style="display:flex;align-items:center;gap:10px"><span class="lbl" style="width:34px">8px</span><span style="height:6px;width:48px;background:var(--tb-ink-dim)"></span></div><div style="display:flex;align-items:center;gap:10px"><span class="lbl" style="width:34px">10px</span><span style="height:6px;width:60px;background:var(--tb-ink-dim)"></span></div><div style="display:flex;align-items:center;gap:10px"><span class="lbl" style="width:34px">12px</span><span style="height:6px;width:72px;background:var(--tb-ink-dim)"></span></div><div style="display:flex;align-items:center;gap:10px"><span class="lbl" style="width:34px">16px</span><span style="height:6px;width:96px;background:var(--tb-ink-dim)"></span></div><div style="display:flex;align-items:center;gap:10px"><span class="lbl" style="width:34px">20px</span><span style="height:6px;width:120px;background:var(--tb-ink-dim)"></span></div>
</div></body></html>
