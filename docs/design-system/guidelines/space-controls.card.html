<!-- @dsCard group="Space" viewport="700x180" name="Fixed control sizes" subtitle="Dice 92×104, box rows 30, Roll 200×42, meter 140×18" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--tb-background);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-10);align-items:stretch}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--tb-ink-dim);letter-spacing:.04em}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:96px;border:1px solid var(--tb-panel-edge);border-radius:var(--radius-panel);padding:8px}.hex{font-family:var(--font-mono);font-size:11px}</style></head><body>
<div style="display:flex;align-items:flex-end;gap:14px">
<div style="width:92px;height:104px;border:1px dashed var(--tb-panel-edge);border-radius:4px;display:grid;place-items:center"><span class="lbl">92×104</span></div>
<div style="width:228px;height:30px;border:1px dashed var(--tb-panel-edge);border-radius:4px;display:grid;place-items:center"><span class="lbl">228×30 box row</span></div>
<div style="width:200px;height:42px;border:1px dashed var(--tb-panel-edge);border-radius:4px;display:grid;place-items:center"><span class="lbl">200×42 Roll</span></div>
<div style="width:140px;height:18px;border:1px dashed var(--tb-panel-edge);border-radius:4px;display:grid;place-items:center"><span class="lbl">140×18</span></div>
</div></body></html>
